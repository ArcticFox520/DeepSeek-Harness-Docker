name: DeepSeek Harness Docker

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

env:
  IMAGE_NAME: deepseek-harness

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      dsh_version: ${{ steps.resolve.outputs.dsh_version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_manual: ${{ steps.resolve.outputs.is_manual }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            DSH_VERSION=$(tr -d '[:space:]' < VERSION)

            if [ -z "$DSH_VERSION" ]; then
              echo "VERSION 文件为空，终止"
              echo "tag=" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "手动构建: dsh=$DSH_VERSION, tag=$SHORT_SHA"
            echo "dsh_version=$DSH_VERSION" >> $GITHUB_OUTPUT
            echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "is_manual=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LATEST_TAG=$(gh api repos/deepseek-ai/deepseek-harness/tags \
            --jq '.[0].name' 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "tag=" >> $GITHUB_OUTPUT
            exit 0
          fi

          NPM_VERSION=$(echo "$LATEST_TAG" | sed 's/^dsh-v//')

          if ! npm view @deepseek-ai/dsh@"$NPM_VERSION" version 2>/dev/null; then
            echo "tag=" >> $GITHUB_OUTPUT
            exit 0
          fi

          if docker manifest inspect \
              "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${NPM_VERSION}" \
              >/dev/null 2>&1; then
            echo "tag=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "dsh_version=$NPM_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$NPM_VERSION" >> $GITHUB_OUTPUT
          echo "is_manual=false" >> $GITHUB_OUTPUT

  build-and-push:
    needs: resolve-version
    if: needs.resolve-version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DSH_VERSION=${{ needs.resolve-version.outputs.dsh_version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-version.outputs.tag }}
            ${{ needs.resolve-version.outputs.is_manual == 'false' && format('{0}/{1}:latest', secrets.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-readme:
    needs: [build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: "DeepSeek Harness (dsh) with socat reverse proxy"
          readme-filepath: ./README.md
